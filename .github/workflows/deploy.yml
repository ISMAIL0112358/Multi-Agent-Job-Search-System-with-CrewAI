name: CD Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Auto-Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to home
            cd /home/ubuntu
            
            # Auto-clone if directory does not exist, otherwise pull
            if [ ! -d "Multi-Agent-Job-Search-System-with-CrewAI" ]; then
              git clone git@github.com:ISMAIL0112358/Multi-Agent-Job-Search-System-with-CrewAI.git
              cd Multi-Agent-Job-Search-System-with-CrewAI
            else
              cd Multi-Agent-Job-Search-System-with-CrewAI
              git pull origin main
            fi
            
            # Detect and execute docker compose / docker-compose command
            if command -v docker-compose &> /dev/null; then
              docker-compose up -d --build
            elif docker compose version &> /dev/null; then
              docker compose up -d --build
            else
              echo "Error: neither docker-compose nor docker compose command found."
              exit 1
            fi
