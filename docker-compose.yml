version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: always
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api # Will proxy /api requests to backend or use backend domain
    ports:
      - "127.0.0.1:8080:80"
    restart: always
